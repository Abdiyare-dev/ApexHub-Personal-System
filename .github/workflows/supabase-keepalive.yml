# Keeps the Supabase free-tier project from pausing.
#
# Free projects pause after roughly a week without API activity. Pausing does
# not delete data — you can restore from the dashboard — but it means the app
# is down until you notice. This job makes one tiny read every few days so the
# project never goes idle long enough to pause.
#
# Setup (one time): add two repository secrets under
# Settings -> Secrets and variables -> Actions:
#   SUPABASE_URL       your https://<project>.supabase.co URL
#   SUPABASE_ANON_KEY  the anon/publishable key (safe to use here — it is
#                      already shipped to browsers and is protected by RLS)

name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *' # every 3 days at 06:00 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Supabase project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${SUPABASE_URL}/auth/v1/health")
          echo "Supabase Auth Health response: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "Supabase keep-alive ping successful!"
            exit 0
          fi

          CODE_REST=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" "${SUPABASE_URL}/rest/v1/")
          echo "Supabase REST response: $CODE_REST"
          if [ "$CODE_REST" = "200" ]; then
            echo "Supabase keep-alive ping successful via REST!"
            exit 0
          fi

          echo "Error: Ping returned status $CODE (Auth) / $CODE_REST (REST)"
          exit 1
