# Keeps the Supabase free-tier project from pausing.
#
# Free projects pause after roughly a week without API activity. Pausing does
# not delete data — you can restore from the dashboard — but it means the app
# is down until you notice. This job makes one tiny read every few days so the
# project never goes idle long enough to pause.
#
# Setup (one time): add two repository secrets under
# Settings -> Secrets and variables -> Actions:
#   SUPABASE_URL       your https://<project>.supabase.co URL
#   SUPABASE_ANON_KEY  the anon/publishable key (safe to use here — it is
#                      already shipped to browsers and is protected by RLS)

name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *' # every 3 days at 06:00 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Supabase project
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          RAW_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Strip any accidental 'VARIABLE_NAME=', quotes, spaces, or trailing slashes
          URL=$(echo "$RAW_URL" | sed -e 's/^.*=//' -e 's/["'\'']//g' -e 's/[[:space:]]//g' -e 's/\/$//')
          KEY=$(echo "$RAW_KEY" | sed -e 's/^.*=//' -e 's/["'\'']//g' -e 's/[[:space:]]//g')

          # 1. Ping Auth health check with apikey header
          CODE_AUTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -H "apikey: $KEY" "${URL}/auth/v1/health")
          echo "Supabase Auth Health response: $CODE_AUTH"

          # 2. Ping PostgREST tasks endpoint with apikey & auth header
          CODE_REST=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "${URL}/rest/v1/tasks?select=id&limit=1")
          echo "Supabase REST response: $CODE_REST"

          if [ "$CODE_AUTH" = "200" ] || [ "$CODE_REST" = "200" ]; then
            echo "✅ Supabase keep-alive ping successful (HTTP 200)!"
            exit 0
          fi

          # If Supabase responds with 401/403/404/204/206, the instance is alive and awake
          if [[ "$CODE_AUTH" =~ ^(200|204|401|403)$ ]] || [[ "$CODE_REST" =~ ^(200|204|206|401|403|404)$ ]]; then
            echo "✅ Supabase project is online and received ping traffic (Status: Auth $CODE_AUTH / REST $CODE_REST)!"
            exit 0
          fi

          echo "::error::Ping failed! Unable to reach Supabase project (Auth: $CODE_AUTH, REST: $CODE_REST)."
          exit 1
