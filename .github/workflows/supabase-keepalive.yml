# Keeps the Supabase free-tier project from pausing.
#
# Free projects pause after roughly a week without API activity. Pausing does
# not delete data — you can restore from the dashboard — but it means the app
# is down until you notice. This job makes one tiny read every few days so the
# project never goes idle long enough to pause.
#
# Setup (one time): add two repository secrets under
# Settings -> Secrets and variables -> Actions:
#   SUPABASE_URL       your https://<project>.supabase.co URL
#   SUPABASE_ANON_KEY  the anon/publishable key (safe to use here — it is
#                      already shipped to browsers and is protected by RLS)

name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *' # every 3 days at 06:00 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Strip surrounding quotes and whitespace if present
          URL=$(echo "$SUPABASE_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'\''']//' -e 's/["'\''']$//' -e 's/\/$//')
          KEY=$(echo "$SUPABASE_ANON_KEY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'\''']//' -e 's/["'\''']$//')

          if [ -z "$URL" ]; then
            echo "::error::SUPABASE_URL is empty! Please add SUPABASE_URL (or NEXT_PUBLIC_SUPABASE_URL) to GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ -z "$KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY is empty! Please add SUPABASE_ANON_KEY (or NEXT_PUBLIC_SUPABASE_ANON_KEY) to GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Pinging: ${URL}/rest/v1/categories?select=id&limit=1"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "${URL}/rest/v1/categories?select=id&limit=1")
          echo "Supabase responded with HTTP code: $code"
          if [ "$code" != "200" ] && [ "$code" != "204" ] && [ "$code" != "206" ]; then
            echo "::error::Unexpected status $code — the project may be paused or the secret key is invalid."
            exit 1
          fi
          echo "Keep-alive ping successful!"
