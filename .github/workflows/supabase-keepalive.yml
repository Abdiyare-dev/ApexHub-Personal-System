# Keeps the Supabase free-tier project from pausing.
#
# Free projects pause after roughly a week without API activity. Pausing does
# not delete data — you can restore from the dashboard — but it means the app
# is down until you notice. This job makes one tiny read every few days so the
# project never goes idle long enough to pause.
#
# Setup (one time): add two repository secrets under
# Settings -> Secrets and variables -> Actions:
#   SUPABASE_URL       your https://<project>.supabase.co URL
#   SUPABASE_ANON_KEY  the anon/publishable key (safe to use here — it is
#                      already shipped to browsers and is protected by RLS)

name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *' # every 3 days at 06:00 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Supabase project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Clean whitespace, quotation marks, and trailing slashes
          URL=$(echo "$SUPABASE_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'\''']//' -e 's/["'\''']$//' -e 's/\/$//')
          KEY=$(echo "$SUPABASE_ANON_KEY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'\''']//' -e 's/["'\''']$//')

          # Auto-prefix https:// if omitted
          if [ -n "$URL" ] && [[ ! "$URL" =~ ^https?:// ]]; then
            URL="https://$URL"
          fi

          if [ -z "$URL" ]; then
            echo "::error::SUPABASE_URL is missing! Please ensure you added SUPABASE_URL (or NEXT_PUBLIC_SUPABASE_URL) under GitHub Settings -> Secrets and variables -> Actions (Repository secrets, NOT Environment secrets)."
            exit 1
          fi

          echo "Pinging Supabase health endpoint at $URL ..."

          # 1. First attempt: Supabase Auth Health Endpoint (Lightweight & Always available on active instances)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${URL}/auth/v1/health")
          echo "Auth health check response code: $HTTP_CODE"

          # 2. Second attempt: PostgREST root API (if auth health isn't 200)
          if [ "$HTTP_CODE" != "200" ]; then
            if [ -n "$KEY" ]; then
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
                -H "apikey: $KEY" \
                -H "Authorization: Bearer $KEY" \
                "${URL}/rest/v1/")
              echo "REST root response code: $HTTP_CODE"
            fi
          fi

          # Accept 200, 204, or 300-level redirects
          if [[ "$HTTP_CODE" =~ ^(200|204|206|301|302|307|308)$ ]]; then
            echo "✅ Supabase project is active and ping succeeded! (HTTP $HTTP_CODE)"
          else
            echo "::error::Ping failed with status code $HTTP_CODE. The project might be paused or the URL is incorrect."
            exit 1
          fi
